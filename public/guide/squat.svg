<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img" aria-label="스쿼트 예시: 가장 깊이 앉은 순간과 카메라 위치">
  <rect width="320" height="240" rx="12" fill="#f4f7fb"/>
  <line x1="20" y1="200" x2="300" y2="200" stroke="#9aa5b1" stroke-width="3" stroke-linecap="round"/>
  <!-- 찍을 자세 (옆모습, 오른쪽을 봄) -->
  <g stroke="#1f3a5f" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <circle cx="150" cy="68" r="14" fill="#1f3a5f"/>
    <line x1="146" y1="88" x2="112" y2="136"/>
    <line x1="112" y1="136" x2="172" y2="142"/>
    <line x1="172" y1="142" x2="158" y2="198"/>
    <line x1="158" y1="198" x2="184" y2="198"/>
    <line x1="140" y1="100" x2="190" y2="104" stroke-width="5"/>
  </g>
  <!-- 카메라 (옆, 허리 높이) -->
  <g>
    <line x1="228" y1="140" x2="200" y2="140" stroke="#e07a1f" stroke-width="2" stroke-dasharray="5 4"/>
    <rect x="228" y="124" width="34" height="32" rx="5" fill="#e07a1f"/>
    <circle cx="238" cy="140" r="8" fill="#fff"/>
    <circle cx="238" cy="140" r="4" fill="#e07a1f"/>
    <line x1="245" y1="156" x2="245" y2="200" stroke="#e07a1f" stroke-width="3"/>
    <text x="226" y="188" font-size="13" fill="#e07a1f" font-family="sans-serif" font-weight="bold" text-anchor="middle">2~3m</text>
  </g>
  <text x="160" y="228" font-size="13" fill="#1f3a5f" font-family="sans-serif" text-anchor="middle">가장 깊이 앉은 순간 · 옆에서 전신</text>
</svg>
