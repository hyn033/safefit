<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img" aria-label="일반 안내: 옆에서 전신이 보이게 카메라를 두는 위치">
  <rect width="320" height="240" rx="12" fill="#f4f7fb"/>
  <line x1="20" y1="200" x2="300" y2="200" stroke="#9aa5b1" stroke-width="3" stroke-linecap="round"/>
  <!-- 서 있는 사람 (옆모습) -->
  <g stroke="#1f3a5f" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <circle cx="110" cy="48" r="14" fill="#1f3a5f"/>
    <line x1="110" y1="68" x2="108" y2="132"/>
    <line x1="108" y1="132" x2="108" y2="196"/>
    <line x1="108" y1="196" x2="130" y2="196"/>
    <line x1="110" y1="82" x2="132" y2="116" stroke-width="5"/>
  </g>
  <!-- 카메라 -->
  <g>
    <line x1="228" y1="130" x2="150" y2="130" stroke="#e07a1f" stroke-width="2" stroke-dasharray="5 4"/>
    <rect x="228" y="114" width="34" height="32" rx="5" fill="#e07a1f"/>
    <circle cx="238" cy="130" r="8" fill="#fff"/>
    <circle cx="238" cy="130" r="4" fill="#e07a1f"/>
    <line x1="245" y1="146" x2="245" y2="200" stroke="#e07a1f" stroke-width="3"/>
    <text x="190" y="118" font-size="13" fill="#e07a1f" font-family="sans-serif" font-weight="bold" text-anchor="middle">2~3m</text>
  </g>
  <text x="160" y="228" font-size="13" fill="#1f3a5f" font-family="sans-serif" text-anchor="middle">가장 힘든 순간 · 옆에서 전신이 보이게</text>
</svg>
