<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img" aria-label="런지 예시: 앞무릎이 가장 굽혀진 순간과 카메라 위치">
  <rect width="320" height="240" rx="12" fill="#f4f7fb"/>
  <line x1="20" y1="200" x2="300" y2="200" stroke="#9aa5b1" stroke-width="3" stroke-linecap="round"/>
  <!-- 찍을 자세 (옆모습, 오른쪽을 봄) -->
  <g stroke="#1f3a5f" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <circle cx="124" cy="46" r="14" fill="#1f3a5f"/>
    <line x1="124" y1="66" x2="122" y2="128"/>
    <line x1="122" y1="128" x2="170" y2="140"/>
    <line x1="170" y1="140" x2="170" y2="196"/>
    <line x1="170" y1="196" x2="194" y2="196"/>
    <line x1="122" y1="128" x2="92" y2="176"/>
    <line x1="92" y1="176" x2="60" y2="192"/>
    <line x1="124" y1="80" x2="150" y2="104" stroke-width="5"/>
  </g>
  <!-- 카메라 (옆, 허리 높이) -->
  <g>
    <line x1="228" y1="128" x2="205" y2="128" stroke="#e07a1f" stroke-width="2" stroke-dasharray="5 4"/>
    <rect x="228" y="112" width="34" height="32" rx="5" fill="#e07a1f"/>
    <circle cx="238" cy="128" r="8" fill="#fff"/>
    <circle cx="238" cy="128" r="4" fill="#e07a1f"/>
    <line x1="245" y1="144" x2="245" y2="200" stroke="#e07a1f" stroke-width="3"/>
    <text x="270" y="188" font-size="13" fill="#e07a1f" font-family="sans-serif" font-weight="bold" text-anchor="middle">2~3m</text>
  </g>
  <text x="160" y="228" font-size="13" fill="#1f3a5f" font-family="sans-serif" text-anchor="middle">앞무릎이 가장 굽혀진 순간 · 옆에서 전신</text>
</svg>
